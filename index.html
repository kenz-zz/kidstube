<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok Kids</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    .feed-container {
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar {
      display: none;
    }
    .video-card {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: auto;
    }
    .ui-overlay {
      position: absolute;
      bottom: 30px;
      left: 15px;
      right: 80px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
    }
    .ui-overlay h3 {
      font-size: 16px;
      margin-bottom: 6px;
      color: #38ef7d;
    }
    .ui-overlay p {
      font-size: 14px;
      line-height: 1.3;
    }
    .action-bar {
      position: absolute;
      right: 15px;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }
    .btn-action {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      color: #fff;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
    .btn-action.liked {
      color: #ff3b5c;
      border-color: #ff3b5c;
    }
  </style>
</head>
<body>

  <div class="feed-container">
    
    <!-- Video Item 1 -->
    <div class="video-card">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&controls=1&loop=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div class="ui-overlay">
        <h3>@EdukasiAnak</h3>
        <p>Belajar Huruf Bersama! 🎨✨ #TikTokKids #Edukasi</p>
      </div>
      <div class="action-bar">
        <button class="btn-action" onclick="toggleLike(this)">❤️</button>
        <button class="btn-action" onclick="shareVideo()">🚀</button>
      </div>
    </div>

    <!-- Video Item 2 -->
    <div class="video-card">
      <iframe src="https://www.youtube.com/embed/L_LUpnjgPso?autoplay=0&controls=1&loop=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div class="ui-overlay">
        <h3>@DuniaSains</h3>
        <p>Eksperimen Warna Warni untuk Anak 🧪🌈</p>
      </div>
      <div class="action-bar">
        <button class="btn-action" onclick="toggleLike(this)">❤️</button>
        <button class="btn-action" onclick="shareVideo()">🚀</button>
      </div>
    </div>

  </div>

  <script>
    function toggleLike(button) {
      button.classList.toggle('liked');
    }

    function shareVideo() {
      if (navigator.share) {
        navigator.share({
          title: 'TikTok Kids Video',
          url: window.location.href
        }).catch(console.error);
      } else {
        alert('Link video disalin!');
      }
    }
  </script>
</body>
</html>
