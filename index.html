<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Kids Web</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        /* Container utama dengan efek snap */
        .container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Sembunyikan scrollbar */
        }
        .container::-webkit-scrollbar { display: none; }

        /* Tiap video 1 layar penuh */
        .video-wrapper {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay UI sederhana */
        .ui {
            position: absolute;
            bottom: 50px;
            left: 20px;
            color: white;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tambahkan video di sini -->
        
        <!-- Video 1 -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=1&mute=0" allowfullscreen></iframe>
            <div class="ui"><h3>Video Edukasi 1</h3></div>
        </div>

        <!-- Video 2 -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/L_LUpnjgPso?controls=1&mute=0" allowfullscreen></iframe>
            <div class="ui"><h3>Video Edukasi 2</h3></div>
        </div>

        <!-- Video 3 -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY?controls=1&mute=0" allowfullscreen></iframe>
            <div class="ui"><h3>Video Edukasi 3</h3></div>
        </div>
    </div>

</body>
</html>
